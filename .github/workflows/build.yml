name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt update
        # Устанавливаем все системные пакеты, включая aidl и build-tools
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev aidl google-android-build-tools-33-installer
        # Даем права на исполнение
        chmod +x main.py
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        # GitHub Actions уже имеет предустановленный Android SDK, просто говорим Buildozer'у, где он
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kavaxsgram-apk
        path: bin/*.apk
